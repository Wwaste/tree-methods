<style>
:root{--bg:#f6f4ef;--ink:#1d1c1a;--muted:#5d5a54;--line:#cfc9bd;--accent:#8a3b12;--card:#fffdf8;--bad:#a8261b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161513;--ink:#ece8df;--muted:#a7a196;--line:#45413a;--accent:#e08a5a;--card:#1f1d1a;--bad:#f08a7e}}
:root[data-theme="dark"]{--bg:#161513;--ink:#ece8df;--muted:#a7a196;--line:#45413a;--accent:#e08a5a;--card:#1f1d1a;--bad:#f08a7e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font:17px/1.6 "PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
form{width:min(420px,calc(100vw - 32px));padding:32px 28px;background:var(--card);border:1px solid var(--line);border-radius:12px}
h1{font-size:24px;line-height:1.3;margin:0 0 6px;font-weight:600}
p{margin:0 0 22px;color:var(--muted);font-size:15px}
label{display:block;font-size:15px;margin-bottom:6px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:16px;width:100%;font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.6em;margin:12px 0 0;color:var(--bad);font-size:15px}
</style>

<script>
(() => {
  const SALT = 'fQWMsrp7kbECVeR/gF7Lkg==', IV = 'T2oaWZpWNrBof8YZ', ITER = 600000, KEEP = 'tree-site-pass';
  const bytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
  const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');
  async function open(pass){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(IV)}, key, bytes(document.getElementById('enc').textContent));
    const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    try { localStorage.setItem(KEEP, pass); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  async function tryOpen(pass, quiet){
    go.disabled = true; msg.textContent = quiet ? '' : '正在打开……';
    try { await open(pass); }
    catch (e) {
      try { localStorage.removeItem(KEEP); } catch (e2) {}
      msg.textContent = quiet ? '' : (window.crypto && crypto.subtle ? '密码不对，请再试一次。' : '请用 https 地址打开这一页。');
      go.disabled = false; pw.select();
    }
  }
  f.addEventListener('submit', e => { e.preventDefault(); tryOpen(pw.value, false); });
  let saved = null; try { saved = localStorage.getItem(KEEP); } catch (e) {}
  if (saved) tryOpen(saved, true);
})();
</script>
